# Gitleaks configuration — The Forward Deployed Engineer's Handbook
#
# This book TEACHES secret hygiene, so its code samples deliberately contain
# EXAMPLE API keys and placeholder infrastructure values. None are real
# credentials. This config allowlists the known teaching placeholders so that
# gitleaks (and, by the inline `# pragma: allowlist secret` convention,
# detect-secrets) do not raise false positives in CI or for readers.
#
# NOTE: RepoClean (a proprietary mobile scanner) does NOT read this file; its
# findings on these same values are documented here as known-benign.

title = "FDE Handbook gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Intentional teaching placeholders — not real secrets"

# Example OpenAI-style keys (085e harness-detection demo, 129 CrewAI mock, 021a
# Dockerfile anti-pattern). Also marked inline with `# pragma: allowlist secret`.
regexes = [
  '''sk-abcdefghijklmnopqrstuvwxyz12345678''',
  '''sk-mock-key-for-demo''',
  '''sk-prod-live-abc''',
]

# Benign infrastructure / IP values that appear in runnable examples. These are
# NOT secrets; gitleaks does not flag them by default, but they are listed so any
# scanner operator (or reviewer) knows they are intentional:
#   0.0.0.0 / 127.0.0.1            standard bind-all / localhost
#   169.254.169.254               cloud metadata endpoint — used to TEACH SSRF defense
#   10.0.0.1 / 10.20.30.1         RFC1918 private example IPs
#   localhost:<port>              local dev services (Ollama 11434, Qdrant 6333, Streamlit 8501, …)
#   s3://my-bucket, s3://cinemastream-staging-data   fictional example buckets
